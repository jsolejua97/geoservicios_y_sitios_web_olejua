
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visor Geográfico de Caldas</title>

    <!-- Librería Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .info {
            padding: 10px;
            font: 14px/16px Arial, sans-serif;
            background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }

        .info h4 {
            margin: 0 0 5px;
            color: #333;
        }

        .legend {
            line-height: 18px;
            color: #555;
        }

        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }

        .leaflet-control-layers {
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
        }

        .search-control {
            background: white;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .search-control input {
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .search-control button {
            padding: 7px 10px;
            background: #183b35;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .search-control button:hover {
            background: #285b4f;
        }

        .leaflet-popup-content {
            max-height: 300px;
            overflow-y: auto;
        }

        .leaflet-popup-content table {
            border-collapse: collapse;
            width: 100%;
        }

        .leaflet-popup-content td {
            padding: 4px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- Contenedor del mapa -->
    <div id="map"></div>

    <!-- Librería JavaScript de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Aplicación geográfica de Caldas -->
    <script src="js/app.js"></script>

</body>
</html>
