<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombia - División Administrativa</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Etiquetas de los departamentos */
        .department-label-container {
            background: transparent;
            border: none;
        }

        .department-label {
            display: inline-block;
            color: #17202a;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            text-shadow:
                1px 1px 2px white,
                -1px -1px 2px white,
                1px -1px 2px white,
                -1px 1px 2px white;
        }

        /* Ventana de información */
        .leaflet-popup-content {
            font-size: 13px;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Código de la aplicación -->
    <script src="js/app.js"></script>

</body>
</html>
